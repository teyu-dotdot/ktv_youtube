name: KTVYouTube
options:
  bundleIdPrefix: com.example.ktvyoutube
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  KaraokeKit:
    path: ../

targets:
  KTVYouTube:
    type: application
    platform: iOS
    # iPad-first, but the same UI adapts to iPhone.
    deploymentTarget: "17.0"
    sources:
      - path: KTVYouTube
        # Referenced via `info.path` below; without this it would also be
        # copied into the bundle as a stray resource.
        excludes:
          - Info.plist
    dependencies:
      - package: KaraokeKit
        product: KaraokeKit
    info:
      path: KTVYouTube/Info.plist
      properties:
        CFBundleDisplayName: KTV
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Keeps the backing track playing with the screen locked.
        UIBackgroundModes:
          - audio
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SUPPORTS_MAC_CATALYST: NO
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ktvyoutube
